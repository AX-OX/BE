spring:
  application:
    name: ax-navigator
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      # Validate the existing SQL-managed schema; never create or alter tables.
      ddl-auto: validate
    generate-ddl: false
    open-in-view: false
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

server:
  port: ${PORT:8080}
  address: 0.0.0.0

ax:
  recovery:
    enabled: ${AX_RECOVERY_ENABLED:false}
    lease-seconds: ${AX_RECOVERY_LEASE_SECONDS:90}
    max-attempts: ${AX_RECOVERY_MAX_ATTEMPTS:5}
    input-retention-hours: ${AX_RECOVERY_INPUT_RETENTION_HOURS:24}
  jwt:
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:12h}
  internal-token: ${INTERNAL_TOKEN}
  agent:
    base-url: ${AGENT_BASE_URL:}
    enabled: ${AGENT_ENABLED:false}
    iam-auth-enabled: ${AGENT_IAM_AUTH_ENABLED:false}
  cors:
    origin: ${CORS_ORIGIN:http://localhost}
  docs:
    dir: ${AX_DOCS_DIR:../db/docs}
  evaluation:
    as-of: ${AX_EVALUATION_AS_OF:}
  time-zone: ${AX_TIME_ZONE:Asia/Seoul}

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    default-models-expand-depth: -1
