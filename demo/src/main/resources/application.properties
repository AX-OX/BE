spring.application.name=ax-navigator
server.port=${PORT:8080}
server.address=0.0.0.0

# Database (스키마는 db/init SQL이 주인, JPA는 검증만)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ax}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ax}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# AX Navigator
ax.jwt.secret=${JWT_SECRET}
ax.jwt.ttl=12h
ax.internal-token=${INTERNAL_TOKEN}
ax.agent.base-url=${AGENT_BASE_URL:}
ax.agent.enabled=${AGENT_ENABLED:false}
ax.cors.origin=${CORS_ORIGIN:http://localhost}
ax.docs.dir=${AX_DOCS_DIR:../db/docs}
ax.evaluation.as-of=${AX_EVALUATION_AS_OF:2026-10-01}
ax.default-company-id=1
# decidedAt(+09:00) 등 시각 표기 기준 시간대
ax.time-zone=${AX_TIME_ZONE:Asia/Seoul}
