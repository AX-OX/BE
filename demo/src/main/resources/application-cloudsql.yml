# Activate with SPRING_PROFILES_ACTIVE=cloudsql.
# Credentials come from the runtime service account (ADC); no JSON key is needed.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        socketFactory: com.google.cloud.sql.postgres.SocketFactory
        cloudSqlInstance: ${INSTANCE_CONNECTION_NAME}
        ipTypes: ${CLOUD_SQL_IP_TYPES}
        cloudSqlRefreshStrategy: lazy
