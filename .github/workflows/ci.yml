name: BE CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: recovery
          POSTGRES_PASSWORD: recovery-test
          POSTGRES_DB: recovery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U recovery -d recovery_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RECOVERY_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/recovery_test
      RECOVERY_TEST_DB_USER: recovery
      RECOVERY_TEST_DB_PASSWORD: recovery-test

    defaults:
      run:
        working-directory: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and Build
        run: bash ./gradlew clean test bootJar --no-daemon
